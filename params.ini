# Coupled Elastic Chains — simulation parameters
# Format: key = value
# Lines starting with '#' and blank lines are ignored.
# Any key omitted here uses the compiled-in default.

# Grid dimensions
Nx   = 32
Ny   = 64

# Elastic coupling constants (along x and along y)
cx   = 1.0
cy   = 1.0

# Pinning strength
V0   = 0.1

# Time step
dt   = 0.01

# Disorder correlation length (piecewise-constant pinning only)
rf   = 10.0

# Temperature: with -DNREPLICAS=N>1, this is the low end of a geometric
# ladder up to kBT=1.0 (ignored if T_list is set below).
kBT  = 0.5

# Optional: explicit, non-uniform parallel-tempering ladder (comma
# -separated, no spaces). Overrides both -DNREPLICAS and the geometric
# ladder above -- its length sets the number of replicas. Useful once
# you've measured swap-acceptance rates (grep "\[SWAP\] Accepted" in the
# job log) and found the geometric ladder under-resolves a specific
# region (e.g. an order/disorder crossover) -- concentrate points there
# instead of adding replicas uniformly in log(T). See README.md.
# T_list = 0.01,0.05,0.1,0.15,0.2,0.3,0.45,0.7,1.0

# Random seeds (overridden by the CLI arguments: ./coupled_chains_sim <seedD> <seedT> ...)
seedD = 42
seedT = 42
